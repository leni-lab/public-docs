#   configtrack.example.ini
#   copy to configtrack.ini and adjust discovery and Git paths
#===============================================================================
[logging console]
log_level       = INFO

[logging pipe]
log_level       = INFO

# [logging file]
# log_file        = configtrack.log
# log_level       = DEBUG

#===============================================================================
#   application discovery, relative to this configuration file
[appinfo local]
patterns        = ../*/appinfo.ini

# [appinfo server]
# patterns        = //server/share/apps/**/appinfo.ini

#===============================================================================
#   local archive, MinGit next to the application directory
[git]
path            = ../mingit/cmd/git.exe
name            = configtrack
email           = configtrack@localhost
timeout         = 30s
# enabled         = no             # optional global pause
# trust_directory = yes            # explicitly allow another filesystem owner

#===============================================================================
[watch]
poll            = 1min
backoff         = 10s
backoff_max     = 5min
