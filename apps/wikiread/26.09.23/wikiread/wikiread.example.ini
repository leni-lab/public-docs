#   wikiread.example.ini
#
#   copy to wikiread.ini and adjust local values as needed
#   see user-docs/settings.md for details
#===============================================================================
#   logging
#-------------------------------------------------------------------------------
[logging]
/asyncio        = WARNING

[logging console]
log_level       = INFO

[logging pipe]
log_level       = INFO

[logging file]
log_file        = wikiread.log
log_level       = DEBUG

#===============================================================================
#   MediaWiki connection
#-------------------------------------------------------------------------------
[mediawiki]
api             = https://example.org/w/api.php
username        = wikiread
password        = bot-password

#===============================================================================
#   output settings
#-------------------------------------------------------------------------------
[output]
path            = output

#===============================================================================
#   optional local archive (MinGit next to the application directory)
#-------------------------------------------------------------------------------
[git]
enabled         = no
path            = ../mingit/cmd/git.exe
name            = wikiread
email           = wikiread@localhost
timeout         = 30s

#===============================================================================
#   page selection
#-------------------------------------------------------------------------------
[pages]
legacy          = keywords, stichworte
config          = config/*

#===============================================================================
#   continuous operation
#-------------------------------------------------------------------------------
[watch]
poll            = 1min
backoff         = 10s
backoff_max     = 5min
