# copy to newsview.ini, relative database paths use this file's directory
[index]
database = D:/db/newsindex-test.db

[news]
path = D:/store

[server]
bind = 127.0.0.1
port = 8080
auto_refresh = 10s
source_link = https://leni.epd.de/detail/doc{src_id}/{src_rev}

[logging console]
log_level = INFO
color_mode = auto

[logging pipe]
log_level = INFO

# [app]
# max_runtime = 8h

#=========================================================================
#   renderer settings
#-------------------------------------------------------------------------
# command executable and cwd are relative to this INI's directory
# --config newsrender.ini is relative to the renderer working directory
[renderer]
command         = ../newsrender/.venv/Scripts/python.exe -m newsrender --processor --config newsrender.ini
cwd             = ../newsrender
# deadlines and limits use the standard Toolkit invocation settings
request_timeout = 30s
# optional readiness check before serving HTTP, no document is processed
# prepare = yes
# command arguments are passed unchanged; Toolkit owns transport and cleanup
# identity, extension, and data are sent per request as MessagePack
# the detail link reuses a separate tab, no presentation setting is needed
