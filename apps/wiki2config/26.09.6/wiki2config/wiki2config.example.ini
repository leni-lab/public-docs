#   wiki2config.example.ini
#
#   copy to wiki2config.ini and adjust local values as needed
#   see user-docs/settings.md for details
#===============================================================================
#   logging
#-------------------------------------------------------------------------------
[logging]
/asyncio        = WARNING

[logging console]
log_level       = INFO

[logging pipe]
log_level       = INFO

[logging file]
log_file        = wiki2config.log
log_level       = DEBUG

#===============================================================================
#   input settings
#-------------------------------------------------------------------------------
[input]
file            = ../wikiread/output/config/users.wiki
namespace       = Config

#===============================================================================
#   processor settings
#-------------------------------------------------------------------------------
[processor]
path            = ../wiki2config-usermgr/dist/wiki2config-usermgr.exe
timeout         = 5min

# development alternative: replace path above and add these arguments
# path          = ../wiki2config-usermgr/.venv/Scripts/python.exe
# args          =
#     -m
#     wiki2config-usermgr
# one complete argument per indented line, --output is supplied automatically

#===============================================================================
#   output settings for config files and reports
#-------------------------------------------------------------------------------
[output]
path            = output/ini

#-------------------------------------------------------------------------------
[reports]
path            = output/reports

#===============================================================================
#   watch settings
#-------------------------------------------------------------------------------
# used with --watch, a normal invocation performs one attempt and exits

[watch]
poll            = 1min
backoff         = 10s
backoff_max     = 5min

# optional shutdown after a fixed duration, for restart by a supervisor
# this limits the entire invocation, processor.timeout limits each child run
# [app]
# max_runtime   = 8h

#===============================================================================
#   optional local Git archive
#-------------------------------------------------------------------------------
# set enabled = yes and supply name and email to archive after activation
# these identify the commit author, not remote credentials

[git]
enabled         = no
path            = ../mingit/cmd/git.exe
name            =
email           =
timeout         = 30s

# set yes only to trust this archive when another account owns its directory
# this changes neither filesystem permissions nor global Git settings
trust_directory = no
