#   newsindex.example.ini
#=========================================================================
#   logging
#-------------------------------------------------------------------------
#   per-logger level overrides; relative names prefixed with app name

[logging]
/asyncio        = warning               # reduce proactor messages

[logging file]
log_file    	= newsindex.log

#=========================================================================
#   news item store settings
#-------------------------------------------------------------------------
[newsstore]
path            = d:/store              # destination path

#=========================================================================
#   indexer settings
#-------------------------------------------------------------------------
[newsindex]
# Keep SQLite on local storage, outside the store.
database        = d:/db/newsindex.db

[indexing]
schema          = newsindex.sql
poll            = 10s
timeout         = 30s
busy_timeout    = 1s

#=========================================================================
#   source processor settings
#-------------------------------------------------------------------------
[source leni]
# complete processor invocation, including fixed startup arguments
# executable and arguments, no shell; double-quote paths containing spaces
command         = leniextract --processor --once
	--field src_id,src_rev,headline_raw
	--field keywords_raw,service,channels,locations

[fields]
# database name = processor field, applies to every source
headline        = headline_raw
keyword         = keywords_raw
channel         = channels
location        = locations
