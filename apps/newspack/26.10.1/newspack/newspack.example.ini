#   newspack.example.ini
#   see user-docs/settings.md for details
#=========================================================================
#   logging
#-------------------------------------------------------------------------
#   per-logger level overrides; relative names prefixed with app name

[logging]
/asyncio        = warning               # suppress asyncio debug messages
# runner = debug                       # relative: newspack.runner

[logging file]
log_file    	= newspack.log

#=========================================================================
#   message store settings
#-------------------------------------------------------------------------
[news]
path            = d:/store              # existing store path
match           = *
min_age         = 48h
