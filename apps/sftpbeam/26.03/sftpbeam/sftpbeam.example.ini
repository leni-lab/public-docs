#   sftpbeam.example.ini - example config for sftpbeam app
#
#   copy to sftpbeam.ini for local usage:
#       cp sftpbeam.example.ini sftpbeam.ini
#
#   see settings.md for details

#=========================================================================
#   app
#-------------------------------------------------------------------------
[app]
max_runtime = 30s                       # default: empty (no limit)

#=========================================================================
#   logging
#-------------------------------------------------------------------------
#   per-logger level overrides; relative names prefixed with app name
[logging]
# filemill.mill = debug                 # relative: sftpbeam.filemill.mill
/asyncssh       = info                  # absolute: asyncssh (leading / = no prefix)

[logging console]
log_level   = TRACE                     # default: INFO
use_color   = true                      # default: true
format      = %(message)s               # default: %(message)s

[logging file]
enabled     = true                      # default: false
log_level   = DEBUG                     # default: DEBUG
log_file    = <default>                 # default: <app_name>.log
format      = <default>                 # default: toolkit preset
date_format = <default>                 # default: %Y-%m-%d %H:%M:%S
encoding    = <default>                 # default: utf-8

#=========================================================================
#   input
#-------------------------------------------------------------------------
#   common defaults; override per [input <name>] section
[input]
work        = ${inbox}/work             # default: ${inbox}/work
retry       = ${inbox}/retry            # default: ${inbox}/retry
done        = ${inbox}/done             # default: ${inbox}/done
fail        = ${inbox}/fail             # default: ${inbox}/fail
review      = ${inbox}/review           # target for exhausted retries

match       = *                         # default: empty (match all), e.g. *.csv, !~$*

poll        = 1s                        # default: 1s
clean_up    = 60min                     # default: empty (disabled)

pre_claim_lock      = true              # default: true
pre_claim_stable    = 2s                # default: 2s
pre_claim_timeout   = 1min              # default: 1min, 0 disables warning

queue_size      = 200                   # default: 200
workers         = 1                     # default: 1
work_timeout    = 60min                 # max processor runtime before retry

retries     = 3                         # default: 3
backoff     = 1s                        # default: 1s
backoff_max = 15s                       # default: 15s

#-------------------------------------------------------------------------
[input orders]
.parent     = input
inbox       = c:/data/inbox/orders

[input bills]
.parent     = input
inbox       = c:/data/inbox/bills

#=========================================================================
#   sftp
#-------------------------------------------------------------------------
#   common defaults; override per [sftp <name>] section
[sftp]
port            = 22                    # default: 22
username        = your-username         # required
password        =                       # optional, prefer key auth
key_file        = c:/keys/id_rsa        # default: empty (use agent)
known_hosts     = known_hosts           # default: ~/.ssh/known_hosts, empty disables check
connect_timeout = 30s                   # default: 30s
keep_alive      = 30s                   # default: 30s, empty disables

#-------------------------------------------------------------------------
[sftp order-server]
.parent         = sftp
host            = order-server.example.com

[sftp bills-server]
.parent         = sftp
host            = bills-server.example.com

#=========================================================================
#   transfer
#-------------------------------------------------------------------------
#   common defaults; each [transfer <name>] defines one pipeline (auto-discovered)
[transfer]
remote_dir      = /inbox                # required, destination directory on server
temp_suffix     = .tmp                  # default: .tmp, empty disables
transfer_timeout = 5min                 # default: 5min

#-------------------------------------------------------------------------
[transfer orders]
.parent         = transfer
sftp            = order-server

[transfer bills]
.parent         = transfer
sftp            = bills-server