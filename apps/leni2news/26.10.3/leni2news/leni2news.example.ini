# leni2news.ini
# see user-docs/settings.md for details

#=========================================================================
# general settings
[app]
# max_runtime = 30s                     # default: empty (no limit)

#=========================================================================
# per-logger overrides, relative names prefixed with leni2news
[logging]
# processor = debug
# filefeed.feed = debug

#=========================================================================
# input settings, relative paths are based on this INI's directory
[input]
inbox = input                          # existing directory, e.g. //server/share/exports
# work = ${inbox}/work
# done = ${inbox}/done
# fail = ${inbox}/fail
# review = ${inbox}/review

# match = *.leni.json
# poll = 1s
# done_expire = 0s                     # disabled, otherwise based on source mtime

# claim_lock = true
# claim_stable = 1s
# claim_first_stable = 2s
# claim_warn_after = 1min              # warning interval, 0s disables warnings

# work_timeout = 60min
# retries = 3
# backoff = 1s
# backoff_max = 15s

#=========================================================================
# output settings
[output]
path = output
# temp_suffix = .tmp                    # required, cannot disable temporary copies
