#   storeindex.example.ini 
#=========================================================================
#   logging
#-------------------------------------------------------------------------
#   per-logger level overrides; relative names prefixed with app name

[logging]
/asyncio        = warning               # reduce protactor messages

[logging file]
log_file    	= storeindex.log 

#=========================================================================
#   message store settings
#-------------------------------------------------------------------------
[store]
path            = d:/store              # destination path
min_age         = 24h

#=========================================================================
#   indexer settings
#-------------------------------------------------------------------------
[index]
# Keep SQLite on local storage, outside the store.
database        = d:/db/storeindex.db
poll            = 10
timeout         = 30
busy_timeout    = 1

#=========================================================================
#   source processor settings
#-------------------------------------------------------------------------
[source leni]
# JSON argument array, no shell. Use an absolute executable path if necessary.
command         = ["leniextract"]
# Increment after changing extraction behavior; archived messages need rebuild.
revision        = 1
