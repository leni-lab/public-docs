# copy to wiki2user.ini and adjust paths
# relative paths are resolved from this file's directory

[logging]
/asyncio = WARNING

[logging console]
log_level = INFO

[logging pipe]
log_level = INFO

[logging file]
log_file = wiki2user.log
log_level = DEBUG

[input]
file = ../wikiread/output/config/users.wiki

[output]
path = output/ini
# initial baseline before the first archive version, empty uses the output directory
previous =

[archive]
# empty or omitted uses the output directory's archive subdirectory
path = ${output:path}/archive

[reports]
# empty or omitted uses the output directory's reports subdirectory
path = ${output:path}/reports

[watch]
poll = 1min
backoff = 10s
backoff_max = 5min
