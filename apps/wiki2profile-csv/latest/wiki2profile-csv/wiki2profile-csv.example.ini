# copy to wiki2profile-csv.ini and adjust paths before exporting
# application paths are relative to this INI file

[export profildienste]
input_path = examples
input_file = profiles.wiki
namespace = Config
output_path = output/csv
# empty date uses today in Europe/Berlin
date =

[logging console]
log_level = INFO
color_mode = auto

[logging pipe]
log_level = INFO

# relative log paths use the program directory
[logging file]
log_file = wiki2profile-csv.log
log_level = DEBUG

# optional cooperative runtime limit
# [app]
# max_runtime = 10min
