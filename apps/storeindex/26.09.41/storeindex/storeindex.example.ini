#   storeindex.example.ini 
#=========================================================================
#   logging
#-------------------------------------------------------------------------
#   per-logger level overrides; relative names prefixed with app name

[logging]
/asyncio        = warning               # reduce proactor messages

[logging file]
log_file    	= storeindex.log 

#=========================================================================
#   news item store settings
#-------------------------------------------------------------------------
[store]
path            = d:/store              # destination path

#=========================================================================
#   indexer settings
#-------------------------------------------------------------------------
[index]
# Keep SQLite on local storage, outside the store.
database        = d:/db/storeindex.db
schema          = storeindex.sql
poll            = 10s
timeout         = 30s
busy_timeout    = 1s

#=========================================================================
#   source processor settings
#-------------------------------------------------------------------------
[source leni]
contract        = leniextract.fields
version         = 1-legacy
# Toolkit adds --processor or --serve. Do not include either in command.
mode            = once
# executable and arguments, no shell; double-quote paths containing spaces
command         = leniextract
	--field src_id,src_rev,transmit_at,title
	--field keyword,service,channel

