#   wiki2config.example.ini
#
#   copy to wiki2config.ini and adjust local values as needed
#   see user-docs/settings.md for details
#===============================================================================
#   logging
#-------------------------------------------------------------------------------
[logging]
/asyncio        = WARNING

[logging console]
log_level       = INFO

[logging pipe]
log_level       = INFO

[logging file]
log_file        = wiki2config.log
log_level       = DEBUG

#===============================================================================
#   watch settings
#-------------------------------------------------------------------------------
[watch]
poll            = 30s
backoff         = 10s
backoff_max     = 5min

# optional shutdown for restart by a supervisor, applies to all jobs
# [app]
# max_runtime   = 8h

#===============================================================================
#   shared Git settings, used by jobs with use_git = yes
#-------------------------------------------------------------------------------
[git]
path            = ../mingit/cmd/git.exe
name            = wiki2config
email           =
timeout         = 30s
trust_directory = no

#===============================================================================
#   conversion defaults, inherited explicitly with .parent = convert
#-------------------------------------------------------------------------------
[convert]
input_path      = ../wikiread/output/config
namespace       = Config
use_git         = no
timeout         = 1min
output_path     = output/config/${name}
report_path     = output/reports/${name}
args            =

#-------------------------------------------------------------------------------
[convert usermgr]
.parent         = convert
processor       = ../wiki2config-usermgr/dist/wiki2user.exe
input_file      = users.wiki

# development alternative: replace processor above and add args
# processor     = ../wiki2config-usermgr/.venv/Scripts/python.exe
# args          = -m wiki2user
# whitespace separates arguments, double quotes group values containing spaces
# args          =
#     -m wiki2user
#     --verbose

# another job can share the input directory, output directories must be separate
# [convert usermgr-test]
# .parent       = convert usermgr
# input_file    = users-test.wiki
# use_git       = no
