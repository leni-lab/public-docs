#   logarchive.example.ini
#
#   Copy to logarchive.ini and adjust the paths.
#   See user-docs/settings.md for details.
#   Run with --dry-run to preview targets without archiving or removing logs.
#=========================================================================
#   log settings
#-------------------------------------------------------------------------
[logging console]
color_mode = auto

[logging file]
# log_file = logarchive.log
rotate = yes

#=========================================================================
#   archive settings
#
#   input_name matches the complete filename, including optional collision suffixes.
#   output_name uses capture groups: $1 = log name, $2 = year, $3 = month.
#-------------------------------------------------------------------------
#   Separate monthly archives per log name, inside year directories.
[archive toolkit]
input_path  = ../logs/toolkit
input_name  = (.+)[.]log[.](\d{4})-(\d{2})-\d{2}(?:[.]\d+)?

output_path = ../archives/toolkit
output_name = $2/$1.$2-$3.zip

#-------------------------------------------------------------------------
#   All matching logs from this input share one archive per month.
[archive services]
input_path  = ../logs/services
input_name  = (.+)[.]log[.](\d{4})-(\d{2})-\d{2}(?:[.]\d+)?

output_path = ../archives/services
output_name = $2/$2-$3.zip
