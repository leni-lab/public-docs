#   configview example configuration
#
#   copy to configview.ini and adjust the settings for your installation
#   see user-docs/settings.md for details
#===============================================================================
#   logging
#-------------------------------------------------------------------------------
[logging console]
log_level       = INFO                      # TRACE to allow -v/-vv
color_mode      = auto

[logging pipe]                              # used when stdout is not a terminal
log_level       = INFO                      # TRACE to allow -v/-vv

#   optional file output, keep logs outside reviewed configuration directories
# [logging file]
# log_file        = C:/logs/configview.log  # use an existing log directory
# log_level       = INFO
# format          = [%(asctime)s] %(levelname)-7s - %(message)s
# date_format     = %Y-%m-%d %H:%M:%S
# encoding        = utf-8

#===============================================================================
#   app settings
#-------------------------------------------------------------------------------
# [app]
# max_runtime     = 8h                      # shutdown after 8h, no automatic restart

#===============================================================================
#   server settings
#-------------------------------------------------------------------------------
[server]
host            = 127.0.0.1
port            = 8080

#===============================================================================
#   format settings
#-------------------------------------------------------------------------------
#   install configview-usermgr separately, omit renderer for original-file review
[format usermgr]
renderer        = .venv/Scripts/configview-usermgr.exe
timeout         = 30s

#===============================================================================
#   application discovery
#-------------------------------------------------------------------------------
#   appinfo.ini describes relative or absolute configuration filenames
#   relative patterns use this configuration file's directory
[appinfo local]
title           = Local applications
patterns        = C:/apps/**/appinfo.ini
# patterns      = ../*/appinfo.ini, D:/config/**/appinfo.ini
# [appinfo server]
# title         = Server applications
# patterns      = //server/share/config/**/appinfo.ini

#===============================================================================
#   git settings
#-------------------------------------------------------------------------------
[git]
enabled         = no                        # read-only history in existing repos
path            = ../mingit/cmd/git.exe
timeout         = 30s
trust_directory = no                        # allow a different filesystem owner
limit           = 100                       # maximum commits per configuration
