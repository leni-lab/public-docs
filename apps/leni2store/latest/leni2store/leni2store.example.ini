# leni2store.ini
# see user-docs/settings.md for details

#=========================================================================
# general settings
[app]
# max_runtime = 30s                     # default: empty (no limit)

#=========================================================================
# per-logger overrides, relative names prefixed with leni2store
[logging]
# processor = debug
# filemill.mill = debug

#=========================================================================
# input settings, relative paths are based on this INI's directory
[input]
inbox = input                          # existing directory, e.g. //server/share/exports
# work = ${inbox}/work
# retry = ${inbox}/retry
# done = ${inbox}/done
# fail = ${inbox}/fail
# review = ${inbox}/review

# match = *.leni.json
# poll = 1s
# done_max_age = 0s                     # disabled, otherwise based on source mtime

# pre_claim_lock = true
# pre_claim_stable = 1s
# pre_claim_timeout = 1min              # warning interval, 0s disables warnings

# queue_size = 200
# workers = 1
# work_timeout = 60min
# retries = 3
# backoff = 1s
# backoff_max = 15s

#=========================================================================
# output settings
[output]
path = output
# temp_suffix = .tmp                    # required, cannot disable temporary copies
